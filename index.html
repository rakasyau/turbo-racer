<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Turbo Racer — Game Balapan Mobil</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%230b1f3a'/%3E%3Cpath d='M14 62 L38 50 L62 50 L86 62 L80 76 L60 70 L40 70 L20 76 Z' fill='%2322b8ff'/%3E%3Ccircle cx='30' cy='74' r='8' fill='%23ffd54f'/%3E%3Ccircle cx='70' cy='74' r='8' fill='%23ffd54f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="wrap">

  <canvas id="game" width="1024" height="768"></canvas>

  <!-- ===== HUD ===== -->
  <div id="hud" class="hidden">
    <div id="hud-top">
      <div id="score-box">
        <span class="label">JARAK</span>
        <span id="score-value">0 m</span>
      </div>
      <div id="hearts">&#x2764;&#x2764;&#x2764;</div>
      <div id="best-box">
        <span class="label">TERBAIK</span>
        <span id="best-value">0 m</span>
      </div>
    </div>
      <div id="speed-box">
        <span id="speed-value">0</span>
        <span id="speed-unit">km/jam</span>
      </div>
      <div id="turbo-box" aria-label="Meter turbo">
        <span class="turbo-label">TURBO</span>
        <span class="turbo-track"><i id="turbo-fill"></i></span>
        <span id="turbo-key">SHIFT</span>
      </div>
  </div>

  <!-- ===== MENU ===== -->
  <div id="menu" class="overlay">
    <h1 class="title">TURBO<span>RACER</span></h1>
    <p class="tagline">Game balapan mobil pseudo-3D &mdash; hindari mobil lain, jangan nabrak!</p>
    <div class="controls">
      <p><kbd>&larr;</kbd><kbd>&rarr;</kbd> / <kbd>A</kbd><kbd>D</kbd> &nbsp;belok</p>
      <p><kbd>&uarr;</kbd> / <kbd>W</kbd> &nbsp;gas &nbsp;&nbsp; <kbd>&darr;</kbd> / <kbd>S</kbd> &nbsp;rem</p>
      <p><kbd>Shift</kbd> turbo &nbsp;&nbsp; <kbd>P</kbd> jeda &nbsp;&nbsp; <kbd>M</kbd> suara</p>
    </div>
    <p id="menu-best" class="best"></p>
    <button id="start-btn">MULAI BALAP &raquo;</button>
  </div>

  <!-- ===== COUNTDOWN ===== -->
  <div id="countdown" class="overlay hidden">
    <div id="countdown-text">3</div>
  </div>

  <!-- ===== PAUSED ===== -->
  <div id="paused" class="overlay hidden">
    <h2>JEDA</h2>
    <p>Tekan <kbd>P</kbd> atau <kbd>ESC</kbd> untuk lanjut</p>
  </div>

  <!-- ===== GAME OVER ===== -->
  <div id="gameover" class="overlay hidden">
    <h2 class="crash-title">KECELAKAAN!</h2>
    <p id="go-score" class="big-score"></p>
    <p id="go-best" class="best"></p>
    <button id="again-btn">BALAP LAGI &raquo;</button>
  </div>

  <!-- ===== TOUCH CONTROLS (mobile) ===== -->
  <div id="touch" class="hidden">
    <button class="t-btn t-left"  data-k="left"  aria-label="Belok kiri">&#9664;</button>
    <button class="t-btn t-right" data-k="right" aria-label="Belok kanan">&#9654;</button>
    <button class="t-btn t-rem"   data-k="down"  aria-label="Rem">REM</button>
    <button class="t-btn t-gas"   data-k="up"    aria-label="Gas">GAS</button>
    <button class="t-btn t-turbo" data-k="turbo" aria-label="Aktifkan turbo">TURBO</button>
  </div>

</div>

<script src="game.js"></script>
</body>
</html>
